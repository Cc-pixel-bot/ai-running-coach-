<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>练前动态激活 · 智程</title><link rel="stylesheet" href="../assets/redesign.css"></head>
<body data-page="warmup"><main class="phone screen-blue screen-movement"><section class="page-content">
  <header class="page-heading"><h1>练前动态激活</h1></header>
  <article class="panel movement-card"><div class="movement-head"><div style="flex:1"><strong>踝关节绕环</strong><small>8–10 圈 / 方向 / 侧</small></div><button class="movement-complete" type="button" aria-label="标记此动作为完成" aria-pressed="false"></button></div><img class="movement-image" src="../assets/actions/ACT-ANKLE.png" alt="跑者扶着公园栏杆进行踝关节绕环" loading="lazy"><div class="tip">✧　要点：动作缓慢，不追求最大幅度，出现疼痛时停止</div></article>
  <article class="panel movement-card"><div class="movement-head"><div style="flex:1"><strong>左右摆腿</strong><small>8–10 次 / 侧</small></div><button class="movement-complete" type="button" aria-label="标记此动作为完成" aria-pressed="false"></button></div><img class="movement-image" src="../assets/actions/ACT-LEG-S.png" alt="跑者扶着公园栏杆进行左右摆腿" loading="lazy"><div class="tip">✧　要点：单腿站稳，以髋为轴控制摆动，幅度以舒适为准</div></article>
  <div style="flex:1"></div><div class="bottom-action"><button class="primary-button" type="button">开始跑步</button></div>
</section></main><script src="../assets/redesign-app.js?v=20261111-course-4" defer></script></body></html>
