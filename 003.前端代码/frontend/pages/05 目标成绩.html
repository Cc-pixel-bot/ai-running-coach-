<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新版建档 4 - 目标成绩</title>
  <link rel="stylesheet" href="../assets/redesign.css">
</head>
<body data-page="profile-target">
  <div class="phone">
    <header class="topbar">
      <span class="back" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 19-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="steps" aria-label="第4页，共5页"><span class="active"></span><span class="active"></span><span class="active"></span><span class="active"></span><span></span></div>
      <span style="width:40px"></span>
    </header>
    <main class="content">
      <h1>给这段训练一个目标</h1>
      <section class="card goal-card">
        <div class="goal-caption">10K目标</div>
        <div class="goal-value">
          <input id="target-minutes" type="number" inputmode="numeric" min="40" max="70" aria-label="10公里目标时间，分钟">
          <span class="stepper" aria-hidden="true"><span>▲</span><span>▼</span></span>
          <span class="goal-unit">分钟</span>
        </div>
      </section>
    </main>
    <footer class="action"><button type="button">继续 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h16m-7-7 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></footer>
  </div>
<script src="../assets/redesign-app.js" defer></script></body>
</html>
