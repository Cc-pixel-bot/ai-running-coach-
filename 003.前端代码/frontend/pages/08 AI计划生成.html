<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseEnergy {
      0%, 100% { transform: scale(0.97); opacity: 0.6; }
      50% { transform: scale(1.04); opacity: 0.95; }
    }
    @keyframes waveBar {
      0%, 100% { height: 4px; opacity: 0.5; }
      50% { height: 16px; opacity: 1; }
    }
    @keyframes flowLeft {
      0% { transform: translateX(0); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateX(45px); opacity: 0; }
    }
    @keyframes flowRight {
      0% { transform: translateX(0); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateX(-45px); opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.4; }
      50% { transform: translateY(-8px) scale(1.15); opacity: 0.95; }
    }
    .orbit-outer {
      animation: spinCounterClockwise 36s linear infinite;
    }
    .orbit-mid {
      animation: spinClockwise 22s linear infinite;
    }
    .energy-pulse {
      animation: pulseEnergy 3.2s ease-in-out infinite;
    }
    .bar-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; }
    .bar-2 { animation: waveBar 1.2s ease-in-out infinite 0.25s; }
    .bar-3 { animation: waveBar 1.2s ease-in-out infinite 0.4s; }
    .bar-4 { animation: waveBar 1.2s ease-in-out infinite 0.55s; }
    .bar-5 { animation: waveBar 1.2s ease-in-out infinite 0.7s; }
    .bar-6 { animation: waveBar 1.2s ease-in-out infinite 0.3s; }
    .bar-7 { animation: waveBar 1.2s ease-in-out infinite 0.15s; }
    .flow-dot-left {
      animation: flowLeft 2.4s ease-in-out infinite;
    }
    .flow-dot-right {
      animation: flowRight 2.4s ease-in-out infinite 0.8s;
    }
    .particle-float {
      animation: floatParticle 4s ease-in-out infinite;
    }
</style>
