<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    ::-webkit-scrollbar { display: none; }

    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseEnergy {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.05); opacity: 0.95; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.4; }
      50% { transform: translateY(-7px) scale(1.15); opacity: 0.95; }
    }
    .orbit-outer {
      animation: spinCounterClockwise 36s linear infinite;
    }
    .orbit-mid {
      animation: spinClockwise 22s linear infinite;
    }
    .energy-pulse {
      animation: pulseEnergy 3.2s ease-in-out infinite;
    }
    .particle-float-1 {
      animation: floatParticle 3.8s ease-in-out infinite;
    }
    .particle-float-2 {
      animation: floatParticle 4.4s ease-in-out infinite 1.2s;
    }
    .particle-float-3 {
      animation: floatParticle 3.2s ease-in-out infinite 0.7s;
    }
</style>
