<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>练后静态拉伸 · 智程</title><link rel="stylesheet" href="../assets/redesign.css"></head>
<body data-page="stretch"><main class="phone screen-blue screen-movement"><section class="page-content">
  <header class="page-heading"><h1>练后静态拉伸</h1></header>
  <article class="panel movement-card"><div class="movement-head"><div style="flex:1"><strong>小腿静态拉伸</strong><small>15–30 秒 / 侧 · 重复 1–2 次</small></div><button class="movement-complete" type="button" aria-label="标记此动作为完成" aria-pressed="false"></button></div><img class="movement-image" src="../assets/actions/ST-CALF.png" alt="跑者扶着公园栏杆进行小腿静态拉伸" loading="lazy"><div class="tip">✧　要点：后脚跟着地，只保持轻微牵拉感，不压到疼痛</div></article>
  <article class="panel movement-card"><div class="movement-head"><div style="flex:1"><strong>大腿前侧静态拉伸</strong><small>15–30 秒 / 侧 · 重复 1–2 次</small></div><button class="movement-complete" type="button" aria-label="标记此动作为完成" aria-pressed="false"></button></div><img class="movement-image" src="../assets/actions/ST-QUAD.png" alt="跑者单手扶着栏杆进行大腿前侧静态拉伸" loading="lazy"><div class="tip">✧　要点：膝盖朝下、骨盆稳定；出现疼痛时停止</div></article>
