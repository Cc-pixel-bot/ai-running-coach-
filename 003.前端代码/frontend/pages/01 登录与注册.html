<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>智程 · 登录与注册</title><link rel="stylesheet" href="../assets/redesign.css"></head>
<body data-page="login"><main class="phone screen-login"><section class="page-content auth-content">
  <div class="brand-mark" aria-label="智程跑步标志"><svg viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="33" fill="#111214"/><path d="M14 45c8-12 15-18 23-19 6-1 11 1 17 7M17 51h33" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="38" cy="16" r="4" fill="#fff"/><path d="m35 23-7 8 8 5-5 10m4-23 8 4 4 8m-19-4-7-1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="m52 15 1.4 4.1 4.1 1.4-4.1 1.4-1.4 4.1-1.4-4.1-4.1-1.4 4.1-1.4z" fill="#67d9c1"/></svg></div><h1 class="auth-title">智程</h1><p class="auth-subtitle">让每一步，都有清晰的方向与节律。</p>
  <div class="panel auth-card"><div class="auth-tabs"><span class="current">登录</span><span>注册</span></div>
    <div class="field"><label for="account-input">账号</label><input id="account-input" type="text" autocomplete="username" maxlength="32" pattern="[A-Za-z0-9]+" placeholder="请输入账号" required></div>
    <div class="field"><label for="password-input">密码</label><input id="password-input" type="password" autocomplete="current-password" minlength="6" maxlength="64" placeholder="请输入密码" required></div>
    <div class="field is-hidden" id="confirm-field"><label for="confirm-password-input">确认密码</label><input id="confirm-password-input" type="password" autocomplete="new-password" minlength="6" maxlength="64" placeholder="请再次输入密码"></div>
    <button class="primary-button" type="button">开启智程跑步 <span>→</span></button>
    <div class="terms">登录即代表同意智程的服务条款与隐私政策</div>
  </div>
</section></main><script src="../assets/redesign-app.js" defer></script></body></html>
