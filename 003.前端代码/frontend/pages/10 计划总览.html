<body class="min-h-full bg-[#F8F9FA] text-[#1D1D1F] antialiased flex flex-col font-sans selection:bg-[#007AFF]/10" data-page="plan-overview">
<!-- 极简克制顶部导航条 -->
<header class="fixed top-0 inset-x-0 z-50 bg-[#F8F9FA]/90 backdrop-blur-xl border-b border-black/[0.04] pt-safe">
<div class="h-11 px-3 flex items-center justify-between">
<button aria-label="返回" class="w-10 h-10 -ml-1 flex items-center justify-center text-[#1D1D1F] active:opacity-40 transition-opacity cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px] font-medium text-[#1D1D1F]">arrow_back_ios_new</span>
</button>
<span class="text-[15px] font-semibold text-[#1D1D1F] tracking-tight">计划总览</span>
<div class="w-10 h-10"></div>
</div>
</header>
<!-- 主体内容区域：纵向长滚动浏览 -->
<main class="flex-1 w-full pt-14 pb-14 pb-safe">
<div class="max-w-md mx-auto px-4 flex flex-col gap-6">
<!-- 顶部计划摘要看板 -->
<section class="pt-3 pb-2 flex flex-col gap-4">
<div class="flex flex-col gap-1.5">

<h1 class="text-[26px] font-bold text-[#1D1D1F] tracking-tight leading-tight">训练计划</h1>

</div>
<!-- 精致双列/环形卡片区 -->
<div class="flex items-center gap-4 py-1">
<!-- 左侧环形进度圈 -->
<div class="relative w-24 h-24 shrink-0 flex items-center justify-center">
<svg class="w-24 h-24 -rotate-90" viewBox="0 0 96 96">
<!-- 底圈 -->
<circle cx="48" cy="48" fill="none" r="40" stroke="#E5E7EB" stroke-width="7"></circle>
<!-- 进度圈: 25% -->
<circle cx="48" cy="48" fill="none" r="40" stroke="#007AFF" stroke-dasharray="251.32" stroke-dashoffset="251.32" stroke-linecap="round" stroke-width="7"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="text-[17px] font-bold tracking-tight text-[#1D1D1F] leading-none">0<span class="text-[11px] font-semibold text-[#007AFF]">%</span></span>
<span class="text-[10px] text-[#86868B] mt-0.5 font-medium">0/0 节</span>
</div>
</div>
<!-- 右侧关键指标矩阵 -->
<div class="flex-1 grid grid-cols-2 gap-y-2.5 gap-x-2 border-l border-black/[0.06] pl-4">
<div class="flex flex-col">
<span class="text-[11px] text-[#86868B]">目标距离</span>
<span class="text-[14px] font-bold text-[#1D1D1F] tracking-tight">10 km</span>
</div>
<div class="flex flex-col">
<span class="text-[11px] text-[#86868B]">目标成绩</span>
<div class="flex items-baseline gap-1">
<span class="text-[14px] font-bold text-[#1D1D1F]">—</span>
<span class="text-[10px] text-[#86868B]">—</span>
</div>
</div>
<div class="flex flex-col">
<span class="text-[11px] text-[#86868B]">计划周期</span>
<span class="text-[14px] font-bold text-[#1D1D1F]">等待 Dify 计划</span>
</div>
<div class="flex flex-col">
<span class="text-[11px] text-[#86868B]">频次 &amp; 总量</span>
<span class="text-[13px] font-bold text-[#1D1D1F]">等待计划数据</span>
</div>
</div>
</div>
</section>
<!-- 连续纵向时间线 (Timeline) -->
<div class="relative flex flex-col pl-2"></div>
</div>
</main>
