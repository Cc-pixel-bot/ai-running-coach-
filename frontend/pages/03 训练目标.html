<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>跑者建档 - 训练目标</title>

<body data-page="profile-goal">
  <div class="phone screen-goal">
    <header class="topbar">
      <span class="back" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 19-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="steps" aria-label="第2页，共5页"><span class="active"></span><span class="active"></span><span></span><span></span><span></span></div>
      <span style="width:40px"></span>
    </header>
    <main class="content">
      <h1>你想跑向哪里</h1>
      <section class="card goal-list-card">
        <div class="goal-options" id="optionsContainer" role="radiogroup" aria-label="选择训练目标">
          <div class="goal-option" role="radio" aria-checked="false" aria-label="提升 5 公里" tabindex="0"><span class="workout-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17h16M6 14l4-4 3 2 5-6"/><path d="M14 6h4v4"/></svg></span><span class="goal-option-copy"><strong>提升 5 公里</strong><small>让每一步都更轻松</small></span><span class="radio" aria-hidden="true"></span></div>
          <div class="goal-option" data-goal="提升 10 公里" role="radio" aria-checked="false" aria-label="提升 10 公里" tabindex="0"><span class="workout-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 17h4l3-5 4 2 4-6 3 2 4-4"/><path d="M22 6h5v5"/><text x="16" y="27" text-anchor="middle">10K</text></svg></span><span class="goal-option-copy"><strong>提升 10 公里</strong><small>循序渐进提升耐力与配速</small></span><span class="radio" aria-hidden="true"></span></div>
          <div class="goal-option" role="radio" aria-checked="false" aria-label="挑战半程马拉松" tabindex="0"><span class="workout-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18c2-7 5-11 9-11s7 4 7 11H4Z"/><path d="M8 16h2m4 0h2M12 7V4m-2 0h4"/></svg></span><span class="goal-option-copy"><strong>挑战半程马拉松</strong><small>把长距离变成日常</small></span><span class="radio" aria-hidden="true"></span></div>
          <div class="goal-option" role="radio" aria-checked="false" aria-label="挑战全程马拉松" tabindex="0"><span class="workout-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 19V8m12 11V8M4 8h16M8 8V5h8v3"/><path d="m12 10 1.1 2.1 2.4.3-1.8 1.7.4 2.4-2.1-1.1-2.1 1.1.4-2.4-1.8-1.7 2.4-.3L12 10Z"/></svg></span><span class="goal-option-copy"><strong>挑战全程马拉松</strong><small>为更大的目标做准备</small></span><span class="radio" aria-hidden="true"></span></div>
        </div>
      </section>
    </main>
    <footer class="action"><button type="button" disabled>继续</button></footer>
  </div>
