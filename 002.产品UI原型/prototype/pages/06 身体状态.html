<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新版建档 5 - 身体状态</title>
  <link rel="stylesheet" href="redesign.css">
</head>
<body data-page="profile-health">
  <div class="phone">
    <header class="topbar">
      <span class="back" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 19-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="steps" aria-label="第5页，共5页"><span class="active"></span><span class="active"></span><span class="active"></span><span class="active"></span><span class="active"></span></div>
      <span style="width:40px"></span>
    </header>
    <main class="content">
      <h1>告诉我们你的身体状态</h1>
      <section class="card health-card">
        <div class="health-option"><span class="health-icon">✚</span><div class="health-copy"><div class="health-title">近期无明显伤痛</div><div class="health-description">关节肌腱处于最佳受载状态</div></div><span class="radio" aria-hidden="true"></span></div>
        <div class="health-option"><span class="health-icon">⚑</span><div class="health-copy"><div class="health-title">膝盖 / 髋骨曾有酸痛</div><div class="health-description">智能适度降低下坡坡度冲击</div></div><span class="radio" aria-hidden="true"></span></div>
        <div class="health-option"><span class="health-icon">♟</span><div class="health-copy"><div class="health-title">跟腱 / 足底筋膜敏感</div><div class="health-description">延长离心强化与前脚掌热身</div></div><span class="radio" aria-hidden="true"></span></div>
        <div class="health-option"><span class="health-icon">✣</span><div class="health-copy"><div class="health-title">腰背部偶尔不适</div><div class="health-description">加入核心抗伸展稳定性编排</div></div><span class="radio" aria-hidden="true"></span></div>
      </section>
    </main>
    <footer class="action"><button type="button">查看我的跑者档案 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12h16m-7-7 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></footer>
  </div>
<script src="redesign-app.js" defer></script></body>
</html>
